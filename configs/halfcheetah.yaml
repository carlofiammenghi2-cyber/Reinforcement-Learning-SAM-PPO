env: HalfCheetah-v4
max_train_steps: 3000000
batch_size: 2048
mini_batch_size: 64
K_epochs: 10
lr_a: 0.0003
lr_c: 0.0003
gamma: 0.99
lamda: 0.95
epsilon: 0.2
rho: 0.008
policy_dist: Gaussian
seed: 42
GAMMA: default
evaluate_freq: 5000
save_freq: 10
convergence_threshold: 8000
entropy_coef: 0.0
use_grad_clip: True
use_lr_decay: True
use_state_norm: True
use_orthogonal_init: True
use_tanh: True
hidden_width: 64
weight_reg: 0.0
